<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的收藏 · 单品小铺</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">铺</span>
      <span class="brand-text"><strong>单品小铺</strong><small>校园二手 · 好物直达</small></span>
    </a>
    <div class="header-actions">
      <div id="nav-guest" hidden>
        <a class="btn btn-ghost btn-sm" href="login.html">登录</a>
        <a class="btn btn-primary btn-sm" href="register.html">注册</a>
      </div>
      <div id="nav-user" hidden>
        <span class="welcome">你好，<b id="nav-username">买家</b></span>
        <a class="btn btn-ghost btn-sm" href="profile.html">个人中心</a>
        <a class="btn btn-ghost btn-sm" href="cart.html">购物车</a>
        <a class="btn btn-ghost btn-sm" href="orders.html">我的订单</a>
        <button type="button" class="btn btn-ghost-danger btn-sm" id="nav-logout">退出</button>
      </div>
      <a class="seller-entry" href="admin.html">卖家后台</a>
    </div>
  </div>
</header>

<main class="container main">

  <section class="card">
    <div class="card-title-row">
      <h3 class="card-title">我的收藏</h3>
      <span class="card-sub" id="fav-count" style="margin:0"></span>
    </div>
    <p class="card-sub">收藏按账号保存、自动去重；商品下架 / 无货会标注，补货后自动恢复</p>

    <div id="fav-loading">
      <div class="skeleton sk-line"></div>
      <div class="skeleton sk-line short"></div>
    </div>

    <div id="fav-empty" class="empty-state" hidden>
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <p>还没有收藏任何商品</p>
      <p style="font-size:12.5px;color:var(--text-muted)">在商品详情或列表点♡「收藏」即可加入</p>
    </div>

    <div id="fav-body" hidden>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>商品</th><th>单价</th><th>库存</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody id="fav-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  第 7 组 · 在线购物系统 · 迭代 4（挑战需求 B）· 买家端
</footer>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/favorite.js"></script>
</body>
</html>
