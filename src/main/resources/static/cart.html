<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>购物车 · 单品小铺</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">铺</span>
      <span class="brand-text"><strong>单品小铺</strong><small>校园二手 · 好物直达</small></span>
    </a>
    <div class="header-actions">
      <div id="nav-guest" hidden>
        <a class="btn btn-ghost btn-sm" href="login.html">登录</a>
        <a class="btn btn-primary btn-sm" href="register.html">注册</a>
      </div>
      <div id="nav-user" hidden>
        <span class="welcome">你好，<b id="nav-username">买家</b></span>
        <a class="btn btn-ghost btn-sm" href="profile.html">个人中心</a>
        <a class="btn btn-ghost btn-sm" href="favorite.html">收藏</a>
        <a class="btn btn-ghost btn-sm" href="orders.html">我的订单</a>
        <button type="button" class="btn btn-ghost-danger btn-sm" id="nav-logout">退出</button>
      </div>
      <a class="seller-entry" href="admin.html">卖家后台</a>
    </div>
  </div>
</header>

<main class="container main">

  <section class="card">
    <div class="card-title-row">
      <h3 class="card-title">购物车</h3>
      <span class="card-sub" id="cart-count" style="margin:0"></span>
    </div>
    <p class="card-sub">勾选商品后可「提交下单」或「转为收藏」；缺货商品会标注并可照常下单，由系统逐件校验</p>

    <div id="cart-loading">
      <div class="skeleton sk-line"></div>
      <div class="skeleton sk-line short"></div>
    </div>

    <div id="cart-empty" class="empty-state" hidden>
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <p>购物车还是空的</p>
      <p style="font-size:12.5px;color:var(--text-muted)">去<a href="index.html">逛逛</a>，看到喜欢的点「加入购物车」</p>
    </div>

    <div id="cart-body" hidden>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:36px"><input type="checkbox" class="cart-check" id="cart-check-all" title="全选"></th>
              <th>商品</th>
              <th>单价</th>
              <th>数量</th>
              <th>小计</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="cart-tbody"></tbody>
        </table>
      </div>

      <div class="cart-bar">
        <span>已选 <b id="cart-selected">0</b> 件 · 合计 <b id="cart-total" style="color:var(--danger)">￥0.00</b></span>
        <span>
          <button type="button" class="btn btn-ghost btn-sm" id="cart-to-fav">转为收藏</button>
          <button type="button" class="btn btn-ghost-danger btn-sm" id="cart-remove">删除所选</button>
          <button type="button" class="btn btn-primary" id="cart-order">提交下单</button>
        </span>
      </div>

      <div class="shortage-tip" id="cart-shortage" hidden></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  第 7 组 · 在线购物系统 · 迭代 4（挑战需求 B）· 买家端
</footer>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
