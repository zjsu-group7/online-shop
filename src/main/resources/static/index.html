<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单品小铺 · 买家端</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M20 26h24l-3 22a4 4 0 0 1-4 4H27a4 4 0 0 1-4-4l-3-22z' fill='white'/%3E%3Cpath d='M24 26v-4a8 8 0 0 1 16 0v4' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">铺</span>
      <span class="brand-text">
        <strong>单品小铺</strong>
        <small>校园二手 · 好物直达</small>
      </span>
    </a>

    <div class="header-actions">
      <!-- 未登录 -->
      <div id="nav-guest" hidden>
        <a class="btn btn-ghost btn-sm" href="login.html">登录</a>
        <a class="btn btn-primary btn-sm" href="register.html">注册</a>
      </div>
      <!-- 已登录 -->
      <div id="nav-user" hidden>
        <span class="welcome">你好，<b id="nav-username">买家</b></span>
        <a class="btn btn-ghost btn-sm" href="profile.html">个人中心</a>
        <a class="btn btn-ghost btn-sm" href="orders.html">我的订单</a>
        <button type="button" class="btn btn-ghost-danger btn-sm" id="nav-logout">退出</button>
      </div>
      <a class="seller-entry" href="admin.html">卖家后台</a>
    </div>
  </div>
</header>

<main class="container main">

  <div id="offline-tip" class="banner banner-muted" hidden>
    未连接到后端服务，当前为<b>静态骨架模式</b>：仅展示页面结构，接口联调后自动显示真实数据。
  </div>

  <!-- 筛选栏 -->
  <section class="card filter-card">
    <div class="filter-row">
      <div class="filter-search">
        <input class="input" id="filter-q" placeholder="搜索商品名称或描述" autocomplete="off">
      </div>
      <select class="input select" id="filter-category">
        <option value="">全部分类</option>
      </select>
      <select class="input select" id="filter-sort"></select>
      <button type="button" class="btn btn-primary" id="filter-search-btn">搜索</button>
      <button type="button" class="btn btn-ghost" id="filter-reset">重置</button>
    </div>
    <div id="filter-summary" class="filter-summary" hidden></div>
  </section>

  <!-- 商品列表 -->
  <section class="card">
    <div id="list-loading">
      <div class="grid">
        <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
        <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
        <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
      </div>
    </div>

    <div id="list-empty" class="empty-state" hidden>
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 8.3L12 13l8.7-4.7"/><path d="M12 13v9"/>
      </svg>
      <p>没有找到符合条件的商品</p>
      <p style="font-size:12.5px;color:var(--text-muted)">换个关键词或分类试试吧</p>
    </div>

    <div id="list-body" hidden>
      <div class="grid" id="product-grid"></div>
      <div class="pagination" id="pagination" hidden></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  第 7 组 · 在线购物系统 · 迭代 2（挑战需求 A）· 买家端
</footer>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/index.js"></script>
</body>
</html>
